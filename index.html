<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Does Alberto's car work?</title>
    <style>
      :root {
        color-scheme: dark light;
        --background: #161616;
        --foreground: #fff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, sans-serif;
      }

      main {
        display: grid;
        width: 100%;
        height: 100vh;
        height: 100svh;
        padding: clamp(1rem, 3vw, 2.5rem);
        place-items: center;
      }

      #message {
        width: 50%;
        height: 50%;
        margin: 0;
        display: grid;
        place-items: center;
        text-align: center;
        font-weight: 300;
        line-height: 0.86;
        letter-spacing: -0.035em;
        hyphens: auto;
      }

    </style>
  </head>
  <body>
    <main>
      <h1 id="message">YES</h1>
    </main>

    <script>
      const message = document.querySelector("#message");
      const stage = document.querySelector("main");

      function fitMessage() {
        const { width, height } = message.getBoundingClientRect();
        if (!width || !height) return;

        // Find the largest font size whose wrapped text stays inside the page.
        let low = 0.1;
        let high = Math.max(width, height) * 2;
        for (let i = 0; i < 24; i += 1) {
          const size = (low + high) / 2;
          message.style.fontSize = `${size}px`;
          if (
            message.scrollWidth <= message.clientWidth + 1 &&
            message.scrollHeight <= message.clientHeight + 1
          ) {
            low = size;
          } else {
            high = size;
          }
        }
        message.style.fontSize = `${low}px`;
      }

      function changeBackground() {
        const channels = new Uint8Array(3);
        crypto.getRandomValues(channels);
        const [red, green, blue] = channels;
        const linearize = (channel) => {
          const value = channel / 255;
          return value <= 0.04045
            ? value / 12.92
            : ((value + 0.055) / 1.055) ** 2.4;
        };
        const luminance =
          0.2126 * linearize(red) +
          0.7152 * linearize(green) +
          0.0722 * linearize(blue);
        document.documentElement.style.setProperty(
          "--background",
          `rgb(${red} ${green} ${blue})`,
        );
        document.documentElement.style.setProperty(
          "--foreground",
          luminance > 0.18 ? "#111" : "#fff",
        );
      }

      changeBackground();
      new ResizeObserver(fitMessage).observe(stage);
      new MutationObserver(fitMessage).observe(message, {
        childList: true,
        characterData: true,
        subtree: true,
      });
      document.fonts.ready.then(fitMessage);
      fitMessage();
    </script>
  </body>
</html>
